<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="blog-title">Travel Blog</h1>
  
  <div class="blog-container">
    <div class="blog-card">
      <img src="./image.jpeg" alt="คาเฟ่เชียงใหม่" class="blog-image">
      <h2 class="card-title">คาเฟ่เชียงใหม่เท่เที่ยว 10 อันดับ 2040</h2>
      <p>รวมคาเฟ่บรรยากาศดี ๆ ที่เชียงใหม่ เหมาะสำหรับสายเที่ยวและสายถ่ายรูป</p>
    </div>

    <div class="blog-card">
      <img src="./image.jpeg" alt="สถานที่น่าเที่ยว" class="blog-image">
      <h2 class="card-title">สถานที่น่าเที่ยว 10 อันดับ 2140</h2>
      <p>แนะนำสถานที่ท่องเที่ยวสุดฮิต ที่คุณไม่ควรพลาดในปี 2140</p>
    </div>
  </div>
</body>
</html>
